<script>
const paths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',live:'M4 5h16v12H4ZM8 21h8M12 17v4',modules:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7Z',community:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',activity:'M3 12h4l3-8 4 16 3-8h4',system:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',sound:'M9 18V5l12-2v13M9 18c0 2-6 3-6 0s6-3 6 0M21 16c0 2-6 3-6 0s6-3 6 0',alert:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',game:'M7 7h10c4 0 6 12 2 12-2 0-3-3-4-3H9c-1 0-2 3-4 3-4 0-2-12 2-12ZM7 9v5M5 11.5h4M16 10h.1M18 13h.1',effects:'m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z',shield:'M12 2 3 6v6c0 6 9 10 9 10s9-4 9-10V6ZM8 12l3 3 5-6',command:'m8 4-6 8 6 8M16 4l6 8-6 8M14 2l-4 20',season:'M12 2v20M3 7l18 10M3 17 21 7M8 4l4 3 4-3M8 20l4-3 4 3',shop:'M3 8h18l-2 13H5ZM8 8V6a4 4 0 0 1 8 0v2',challenge:'M7 3h10v5a5 5 0 0 1-10 0ZM7 5H3v3a4 4 0 0 0 4 4M17 5h4v3a4 4 0 0 1-4 4M12 13v6M7 21h10',pause:'M7 4h3v16H7ZM14 4h3v16h-3Z',stop:'M5 5h14v14H5Z',play:'m6 3 15 9-15 9Z',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l4 2',image:'M3 3h18v18H3ZM3 17l6-6 5 5 3-3 4 4M15 7h.1'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.modules}"/></svg>`;
const tag=(text,kind='')=>`<span class="tag ${kind}">${text}</span>`;
const heading=(eyebrow,title,sub,actions='')=>`<div class="heading"><div><div class="label">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
const panel=(title,body,action='')=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${action}</div>${body}</section>`;
const action=(text,kind='quiet small',what='explain')=>`<button class="${kind}" data-action="${what}">${text}</button>`;
const nav=[['home','Centre de contrôle','home'],['live','Régie live','live'],['modules','Modules','modules'],['community','Communauté','community'],['activity','Activité','activity'],['system','Système','system']];
const moduleGroups=[{name:'Sons & voix',icon:'sound',desc:'Bibliothèque, voix, files et règles de lecture.',items:['Soundboard','TTS'],state:'2 modules'},{name:'Alertes & points de chaîne',icon:'alert',desc:'Une récompense Twitch, son action et son rendu reliés.',items:['Alertes','Points de chaîne'],state:'2 modules'},{name:'Jeux & tirages',icon:'game',desc:'Préparer, ouvrir, piloter et consulter les résultats.',items:['Tombola','Jeu des mots','Roulette','Slots','Duels','Roue du Sub'],state:'6 modules'},{name:'Effets & mise en scène',icon:'effects',desc:'Rendu, cible OBS, effets et composition du stream.',items:['Bonk','Effets visuels','Chaos','Storyboard','Overlay'],state:'Storyboard : à localiser'},{name:'Interactions à sanction',icon:'shield',desc:'Des effets Twitch et OBS clairement annoncés.',items:['Random Ban','Caution','Votekick'],state:'Actions sensibles'},{name:'Musique',icon:'sound',desc:'Demandes, file et décisions Spotify.',items:['Spotify'],state:'1 module'},{name:'Commandes du chat',icon:'command',desc:'Catalogue et séquences de commandes Twitch.',items:['Commandes Twitch'],state:'1 module'},{name:'Événements saisonniers',icon:'season',desc:'Configurations thématiques et outils de saison.',items:['Halloween'],state:'Événement clos · exemple'}];
let current='home',returnFocus=null,toastTimer=null,selectedType='frame',selectedGroup='all';
const state={title:'Exemple · Le cap des mots',target:'1000',period:'once',retro:false,reward:'none',dirty:false,verified:false};
function sidebarScreen(screen){if(screen==='module')return'modules';if(['challenges','shop'].includes(screen))return'community';return screen;}
function render(screen='home',focus=false){current=screen;closeNav();document.querySelector('#main-nav').innerHTML=nav.map(([id,label,ic])=>`<button class="nav-item" ${sidebarScreen(screen)===id?'aria-current="page"':''} data-screen="${id}">${icon(ic)}<span>${label}</span></button>`).join('');document.querySelectorAll('.screens button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));const crumbs={home:['','Centre de contrôle'],live:['','Régie live'],modules:['','Modules'],module:['Modules / Alertes & points de chaîne','Alertes'],community:['','Communauté'],challenges:['Communauté / Défis','Nouveau défi'],shop:['Communauté / Boutique','Atelier cosmétique'],activity:['','Activité'],system:['','Système']};const cr=crumbs[screen]||crumbs.modules;document.querySelector('#crumb').innerHTML=`${cr[0]?`<span class="ancestor">${cr[0]}</span><span class="ancestor">/</span>`:''}<b>${cr[1]}</b>`;const fn={home:homeView,live:liveView,modules:modulesView,module:moduleView,community:communityView,challenges:challengeView,shop:shopView,activity:activityView,system:systemView}[screen]||modulesView;document.querySelector('#content').innerHTML=fn();if(screen==='challenges')bindChallenge();if(screen==='modules')bindDirectory();if(focus)document.querySelector('#content').focus({preventScroll:true});}
function homeView(){return heading('Votre espace de pilotage','Centre de contrôle','L’état du stream, les points à vérifier et les actions utiles, au même endroit.',`<button data-screen="live" class="primary">Ouvrir la régie live →</button>`)+`<div class="issue"><span class="issue-icon">△</span><div><b>2 points à vérifier avant le live</b><p>OBS n’est pas connecté. Le lecteur TTS attend sa source OBS.<br>Exemple de présentation : aucun diagnostic réel dans cette maquette.</p></div><button class="small" data-screen="system">Voir les connexions</button></div><div class="grid cols"><div>${panel('Disponibilité des services',`<div class="status-list"><div class="status-row"><div><b>Core & bot Twitch</b><p>Connexion et autorisation sont deux états distincts.</p></div>${tag('● Connectés','ok')}</div><div class="status-row"><div><b>OBS & lecteurs</b><p>Bonk indisponible · TTS sans lecteur</p></div><div class="actions">${tag('△ À vérifier','warn')}<button class="quiet small" data-screen="system">Détails →</button></div></div><div class="status-row"><div><b>Soundboard</b><p>Lecteur prêt · module autorisé</p></div>${tag('● Prêt','ok')}</div><div class="status-row"><div><b>Défis</b><p>L’état du moteur doit venir du Core.</p></div>${tag('État moteur à confirmer','info')}</div></div>`,`<span class="muted" style="font-size:12px">Scénario fictif</span>`)}<div class="section-title"><h2>Accès rapides</h2><span class="muted" style="font-size:12px">Une adresse par module</span></div><div class="quick-grid"><button class="quick-tile" data-screen="module">${icon('alert')}<span>Alertes</span><small>Rendu et déclencheurs</small></button><button class="quick-tile" data-screen="challenges">${icon('challenge')}<span>Défis</span><small>Conditions et récompenses</small></button><button class="quick-tile" data-screen="shop">${icon('shop')}<span>Boutique</span><small>Catalogue et atelier</small></button></div></div><div class="grid">${panel('Préparer le live',`<div class="panel-body"><ul class="checklist"><li><span class="check">✓</span><div>Contrôler les connexions<small>Core, bot, OBS et lecteurs</small></div></li><li><span class="check">✓</span><div>Vérifier les modules utiles<small>Disponibles et activés séparément</small></div></li><li><span class="dim">○</span><div>Revoir les changements<small>Depuis les pages des modules</small></div></li></ul><p class="footnote">Repères de préparation, sans promesse d’activation groupée.</p></div>`)}${panel('Activité récente',activityList(),`<button class="quiet small" data-screen="activity">Tout voir →</button>`)}</div></div>`;}
function activityList(){return`<ol class="activity"><li><time>18:42</time><div><b>Soundboard disponible</b><p>Lecteur prêt · exemple de rétablissement</p></div></li><li><time>18:39</time><div><b>Réglage d’alerte enregistré</b><p>Exemple d’activité administrative</p></div></li><li><time>18:35</time><div><b>OBS non connecté</b><p>Un état attendu hors live peut rester visible sans alarme répétée.</p></div></li></ol>`;}
function modulesView(){return heading('Catalogue fonctionnel','Modules','Parcourez par usage. Chaque module conserve son contrôle, ses réglages et son historique.')+`<div class="directory-toolbar"><label class="visually-hidden" for="module-search">Rechercher un module</label><input id="module-search" type="search" placeholder="Rechercher un module, un effet, une commande…"><div class="filter-chips"><button class="small" data-filter="all" aria-pressed="true">Tous</button><button class="small" data-filter="favorites" aria-pressed="false">Favoris</button></div></div><div class="module-grid" id="module-grid">${moduleCards()}</div><p class="footnote">Les regroupements sont des repères visuels, sans imposer un clic supplémentaire avant les modules. Storyboard est une destination prévue, non retrouvée dans la base auditée.</p>`;}
function moduleCards(query='',favorites=false){const q=query.toLocaleLowerCase('fr');const groups=moduleGroups.filter(g=>(!favorites||g.items.includes('Alertes'))&&(!q||(g.name+' '+g.items.join(' ')).toLocaleLowerCase('fr').includes(q)));return groups.length?groups.map(g=>`<section class="panel module-card"><div style="display:flex;justify-content:space-between;gap:12px"><span class="module-icon">${icon(g.icon)}</span><span class="tag">${g.state}</span></div><h2>${g.name}</h2><p>${g.desc}</p><div class="module-links">${g.items.map(n=>`<button data-module="${n}">${n}</button>`).join('')}</div></section>`).join(''):`<div class="panel empty full"><b>Aucun module trouvé</b><p>Essayez un nom de module ou effacez la recherche.</p></div>`;}
function bindDirectory(){document.querySelector('#module-search').addEventListener('input',e=>{document.querySelector('#module-grid').innerHTML=moduleCards(e.target.value,selectedGroup==='favorites');});}
function moduleView(){return heading('Module / Alertes','Alertes','Prévisualisez le rendu localement. Les déclenchements vers OBS restent explicites.',`<span class="tag ok">Événements activés · exemple</span><button class="quiet" data-action="favorite">◇ Favori</button>`)+`<div class="subnav" role="tablist" aria-label="Vues du module"><button role="tab" aria-selected="true" data-module-tab="atelier">Atelier</button><button role="tab" aria-selected="false" data-module-tab="triggers">Déclencheurs</button><button role="tab" aria-selected="false" data-module-tab="history">Historique</button></div><div id="module-tab-content">${alertWorkshop()}</div>`;}
function alertWorkshop(){return`<div class="grid cols"><section class="panel"><div class="panel-head"><h2>Aperçu local</h2>${tag('Sans file · sans OBS','info')}</div><div class="panel-body"><div class="preview-stage"><div class="alert-sample"><span class="ornament">✧</span><strong>Bienvenue, Pseudo exemple</strong><p>Variante Follow · illustration de placement</p></div></div><div class="transport"><button class="small" data-action="preview-alert">▷ Lire l’aperçu</button><span class="track"><span></span></span><span class="muted num" style="font-size:12px">02,40 / 08,00 s</span></div><p class="footnote">Le moteur d’aperçu existant reste la référence du rendu. Le visuel ci-dessus est un schéma de maquette.</p></div></section><div class="grid">${panel('Contenu & variante',`<div class="panel-body"><div class="fields"><label class="field full">Famille<select><option>Follow</option><option>Sub</option><option>Bits</option><option>Don</option><option>Raid</option></select></label><label class="field full">Variante<select><option>Exemple de variante</option></select></label><label class="field full">Pseudo de prévisualisation<input value="Pseudo exemple"></label></div><details class="spaced"><summary>Calibrage et données de test</summary><p class="footnote">Placement, superposition, texte long et avance image par image restent disponibles ici.</p></details></div>`)}${panel('Diffusion',`<div class="panel-body"><div class="property-row"><span>Lecteur OBS</span>${tag('Non connecté','warn')}</div><div class="property-row"><span>File</span><b>Vide · exemple</b></div><p class="footnote">Un événement simulé envoyé dans cette file peut être visible à l’antenne.</p><button class="spaced" data-action="queue-alert">Envoyer un test vers OBS…</button></div>`)}</div></div><div class="savebar"><span>Exemple de modification · variante et placement</span><button class="quiet" data-action="discard">Annuler les modifications</button><button class="primary" data-action="save-settings">Enregistrer les réglages</button></div>`;}
function communityView(){return heading('Administration de la communauté','Communauté','Économie, progression et contenus restent reliés, sans confondre les monnaies.')+`<div class="module-grid">${[['Viewers','Recherche, équipement et données d’un viewer.','community','viewer'],['Jetons & économie','Wallet et opérations autorisées, avec leur trace.','activity','wallet'],['Progression & Daily','Niveaux, présence et Daily.','activity','progression'],['Défis','Définir la condition, vérifier et activer séparément.','challenges','challenge'],['Boutique','Titres, badges, cadres, bannières et offres.','shop','shop']].map(([title,desc,s,ic])=>`<section class="panel module-card"><span class="module-icon">${icon(ic)}</span><h2>${title}</h2><p>${desc}</p><button ${['challenges','shop'].includes(s)?`data-screen="${s}"`:'data-action="scope"'} class="small">Ouvrir →</button></section>`).join('')}</div>`;}
function challengeView(){return heading('Atelier de création','Nouveau défi','Une condition compréhensible, une récompense explicite et une activation séparée.',`<button class="quiet" data-screen="community">← Communauté</button>`)+`<div class="draft-strip">${tag('Brouillon de maquette')}<span id="draft-status">En mémoire uniquement · rien d’enregistré</span><span class="push">Moteur Core : état à confirmer</span></div><div class="editor-grid"><div><div class="grid"><section class="panel form-section"><h2 class="form-title"><span class="step-number">1</span> Présentation</h2><div class="fields"><label class="field full">Titre du défi<input id="challenge-title" value="${escapeHtml(state.title)}" maxlength="80"><small>Ce que verra le viewer. Les exemples ne créent aucun contenu réel.</small></label><label class="field full">Description<textarea placeholder="Expliquez l’objectif en une phrase.">Exemple fictif pour explorer l’éditeur.</textarea></label><label class="field">Visibilité<select><option>Public</option><option>Secret</option></select></label><label class="field">Catégorie<input value="general"></label></div><details class="advanced"><summary>Identifiant et icône</summary><div class="fields"><label class="field">Identifiant<input value="exemple-cap-des-mots"><small>À confirmer avant le premier enregistrement.</small></label><label class="field">Icône<input value="trophy"></label></div></details></section><section class="panel form-section"><h2 class="form-title"><span class="step-number">2</span> Condition & période</h2><div class="fields"><label class="field full">Que doit accomplir le viewer ?<select id="challenge-metric"><option>Mots trouvés · Jeu des mots</option></select><small>Choisissez un objectif et consultez son historique disponible.</small></label><label class="field">Objectif<input id="challenge-target" type="number" min="1" step="1" value="${state.target}"></label><label class="field">Période<select id="challenge-period"><option value="once" ${state.period==='once'?'selected':''}>Une seule fois</option><option value="week" ${state.period==='week'?'selected':''}>Chaque semaine</option><option value="month" ${state.period==='month'?'selected':''}>Chaque mois</option></select></label><label class="choice choice-card full"><input id="challenge-retro" type="checkbox" ${state.retro?'checked':''}><span>Compter l’historique existant<small>Peut rendre des viewers immédiatement éligibles à l’activation.</small></span></label></div><details class="advanced"><summary>Dates de début et de fin</summary><div class="fields"><label class="field">Début<input type="datetime-local"><small>Heure de Paris à expliciter dans l’interface finale.</small></label><label class="field">Fin<input type="datetime-local"></label></div></details></section><section class="panel form-section"><h2 class="form-title"><span class="step-number">3</span> Récompense</h2><div class="fields"><label class="field full">Type de récompense<select id="challenge-reward"><option value="none" ${state.reward==='none'?'selected':''}>Aucune</option><option value="reward" ${state.reward==='reward'?'selected':''}>Objet cosmétique existant</option><option value="jetons" ${state.reward==='jetons'?'selected':''}>Jetons</option></select></label><div id="reward-extra" class="full"></div><div class="notice full">La récompense est versée une seule fois par viewer et par période, selon les règles du Core. Un brouillon n’active pas le défi.</div></div></section></div><div id="challenge-errors" class="error spaced" role="status"></div><div class="savebar"><span id="save-status">Non enregistré</span><button data-action="verify-challenge">Vérifier la définition</button><button class="primary" data-action="save-challenge">Enregistrer le brouillon</button></div></div><aside class="editor-aside" aria-label="Résumé du défi">${panel('Aperçu viewer',`<div class="panel-body"><div class="preview-card"><div class="preview-symbol">${icon('challenge')}</div><h3 id="preview-title"></h3><p id="preview-condition"></p><div class="progress-track"><div></div></div><span class="muted" style="font-size:12px">Progression fictive pour illustrer le rendu</span></div></div>`)}${panel('Avant l’activation',`<div class="panel-body"><dl class="summary-list"><div><dt>Prise en compte</dt><dd id="summary-start"></dd></div><div><dt>Récompense</dt><dd id="summary-reward"></dd></div><div><dt>Changement sensible</dt><dd>La condition devient figée après activation.</dd></div></dl><div class="notice warn spaced">L’activation peut compter l’historique et attribuer des récompenses. Elle possède son propre écran de confirmation.</div><button class="spaced" data-action="activation-info">Comprendre l’activation</button></div>`)}</aside></div>`;}
function bindChallenge(){for(const id of ['challenge-title','challenge-target','challenge-period','challenge-retro','challenge-reward']){document.getElementById(id).addEventListener('input',()=>{state.title=document.querySelector('#challenge-title').value;state.target=document.querySelector('#challenge-target').value;state.period=document.querySelector('#challenge-period').value;state.retro=document.querySelector('#challenge-retro').checked;state.reward=document.querySelector('#challenge-reward').value;state.dirty=true;state.verified=false;updateChallenge();});}updateChallenge();}
function updateChallenge(){document.querySelector('#preview-title').textContent=state.title.trim()||'Titre du défi';const target=Number(state.target);const period={once:'une seule fois',week:'chaque semaine, du lundi au dimanche',month:'chaque mois'}[state.period];document.querySelector('#preview-condition').textContent=`Trouver ${Number.isFinite(target)?new Intl.NumberFormat('fr-FR').format(target):'…'} mots, ${period}.`;document.querySelector('#summary-start').textContent=state.retro?'Historique existant inclus à l’activation.':'À partir de l’activation du défi.';document.querySelector('#summary-reward').textContent={none:'Aucune récompense',reward:'Objet existant à sélectionner',jetons:'Montant en Jetons à définir'}[state.reward];document.querySelector('#save-status').textContent=state.dirty?'Modifications non enregistrées':'Non enregistré';const extra=document.querySelector('#reward-extra');if(extra.dataset.kind!==state.reward){extra.dataset.kind=state.reward;extra.innerHTML=state.reward==='jetons'?`<label class="field">Montant en Jetons<input type="number" min="1" placeholder="À définir" id="reward-amount"><small>Montant fictif uniquement dans cette maquette.</small></label>`:state.reward==='reward'?`<label class="field">Objet cosmétique<select id="reward-id"><option value="">Sélectionner un objet existant…</option></select><small>Aucun catalogue réel n’est connecté.</small></label>`:'';}}
function shopView(){return heading('Boutique / Atelier','Atelier Boutique','L’objet, son apparence et ses offres sont trois choses distinctes.',`<button class="quiet" data-screen="community">← Communauté</button>`)+`<div class="draft-strip">${tag('Objet fictif · brouillon')}<span>Maquette sans téléversement ni sauvegarde</span></div><div class="editor-grid"><div class="grid"><section class="panel form-section"><h2 class="form-title"><span class="step-number">1</span> Type d’objet</h2><div class="cosmetic-types">${[['title','Titre','command'],['badge','Badge','shield'],['frame','Cadre','community'],['banner','Bannière','image']].map(([id,label,ic])=>`<button data-type="${id}" aria-pressed="${id===selectedType}">${icon(ic)}${label}</button>`).join('')}</div></section><section class="panel form-section"><h2 class="form-title"><span class="step-number">2</span> Présentation</h2><div class="fields"><label class="field full">Nom affiché<input id="item-name" value="Exemple · Cadre boréal"></label><label class="field">Rareté<select><option>Commun</option><option>Rare</option><option>Épique</option><option>Légendaire</option></select></label><label class="field">Catégorie<input value="general"></label><label class="field full">Description<textarea placeholder="Présentez cet objet."></textarea></label></div><details class="advanced"><summary>Identifiant, niveau, événement et ordre</summary><p class="footnote">Ces champs existants restent accessibles. L’identifiant se confirme avant publication ; aucune règle de déblocage n’est changée.</p></details></section><section class="panel form-section"><h2 class="form-title"><span class="step-number">3</span> Apparence <span class="muted" id="appearance-type">· Cadre</span></h2><div class="dropzone"><span style="color:var(--mint)">${icon('image')}</span><b id="upload-label">Importer le visuel du cadre</b><p id="upload-spec">Image carrée, centre transparent et marge de sécurité.<br>Les contraintes exactes sont celles du validateur existant.</p><button data-action="upload-info">Choisir une image…</button></div><div class="notice spaced">L’aperçu doit reprendre le rendu de raptoru.fr. Ici, les formes servent uniquement à explorer la composition.</div></section><section class="panel form-section"><h2 class="form-title"><span class="step-number">4</span> Disponibilité & offres</h2><div class="property-row"><span>État de l’objet</span>${tag('Brouillon')}</div><div class="property-row"><span>Offre commerciale</span><b>Aucune</b></div><p class="footnote">Publier un objet n’ouvre pas automatiquement une offre. Les Jetons, Bonbons et points Twitch conservent leur propre unité.</p><button data-action="offer-info" class="spaced">Configurer une offre…</button></section><div class="savebar"><span>Objet et aperçu fictifs</span><button data-action="shop-check">Vérifier</button><button class="primary" data-action="shop-save">Enregistrer le brouillon</button></div></div><aside class="editor-aside">${panel('Aperçu carte de joueur',`<div class="panel-body"><div class="player-card"><div class="player-banner"></div><div class="avatar-frame" id="avatar-frame">R</div><div class="player-text"><h3>Pseudo exemple</h3><p id="item-preview-label">Exemple · Cadre boréal</p></div></div><div class="render-size"><span class="tag">Carte de joueur</span><span class="tag">Illustration</span></div><p class="footnote">Prévoir aussi les rendus classement et équipement, à partir des mêmes données.</p></div>`)}${panel('Objets associés',`<div class="panel-body"><div class="catalog-items"><button class="catalog-item" data-action="catalog-info"><span class="catalog-mini frame">R</span>Cadre</button><button class="catalog-item" data-action="catalog-info"><span class="catalog-mini badge">◇</span>Badge</button><button class="catalog-item" data-action="catalog-info"><span class="catalog-mini">Titre</span>Titre</button></div><p class="footnote">Exemples graphiques, sans objet créé dans le Core.</p></div>`)}</aside></div>`;}
function liveView(){return heading('Pendant le stream','Régie live','Des actions épinglées, leur portée et l’activité qui demande votre attention.',`<span class="tag info">Disposition live · exemple</span><button data-action="customize-live" class="quiet">Personnaliser</button>`)+`<div class="grid cols"><div><div class="live-controls"><button class="live-key danger" data-action="stop-effect" disabled title="Indisponible : OBS non connecté">${icon('stop')}<strong>Arrêter l’effet en cours</strong><small>Indisponible · OBS non connecté</small></button><button class="live-key" data-action="tts-pause">${icon('pause')}<strong>Mettre le TTS en pause</strong><small>File TTS · sans remboursement implicite</small></button><button class="live-key" data-screen="module">${icon('alert')}<strong>Contrôler les alertes</strong><small>Ouvrir le module</small></button><button class="live-key" data-module="Tombola">${icon('game')}<strong>Tombola</strong><small>Ouvrir le contrôle du tirage</small></button><button class="live-key" data-module="Spotify">${icon('sound')}<strong>Demandes Spotify</strong><small>Ouvrir la file musicale</small></button><button class="live-key" data-module="Roue du Sub">${icon('challenge')}<strong>Roue du Sub</strong><small>Droits et demandes de tirage</small></button></div><div class="section-title"><h2>Interactions à traiter</h2>${tag('0 en attente · exemple')}</div>${panel('Files de modération',`<div class="empty">${icon('shield')}<b>Aucune intervention dans ce scénario</b><p>Une demande affiche son module, son coût, son état et les actions autorisées.</p><button class="small" data-action="moderation-example">Voir un cas d’intervention</button></div>`)}<p class="footnote">Chaque raccourci réutilise l’action du module. Le panneau ne lance aucune séquence globale de préparation ou d’arrêt.</p></div><div class="grid">${panel('Santé du live',`<div class="row-list"><div><span>Core / bot</span>${tag('Connectés','ok')}</div><div><span>OBS</span>${tag('À vérifier','warn')}</div><div><span>TTS</span>${tag('Lecteur absent','warn')}</div><div><span>Soundboard</span>${tag('Prêt','ok')}</div></div><div class="context-box"><button class="quiet small" data-screen="system">Ouvrir les connexions →</button></div>`)}${panel('Dernières activités',activityList(),`<button class="quiet small" data-screen="activity">Tout voir →</button>`)}</div></div>`;}
function activityView(){return heading('Historique transversal','Activité','Les traces conservent leur module et leur source ; leur affichage peut être regroupé.')+`<div class="grid cols">${panel('Activité récente',activityList())}${panel('Sources disponibles',`<div class="row-list"><div>Activité des modules ${tag('Données existantes')}</div><div>Incidents de supervision ${tag('Données existantes')}</div><div>Achats et remboursements ${tag('Boutique')}</div><div>Statistiques par module ${tag('Via le Core')}</div></div><div class="panel-body"><p class="footnote">La nouvelle vue n’invente pas de statistiques de session ni de corrélation que les données ne permettent pas.</p></div>`)}</div>`;}
function systemView(){return heading('État technique & réglages','Des connexions lisibles.','L’état du bot VPS ne se déduit pas des jetons Twitch de ce PC.')+`<div class="grid two">${panel('Services utilisés en live',`<div class="status-list"><div class="status-row"><div><b>Core</b><p>État de liaison Studio → Core</p></div>${tag('Connecté · exemple','ok')}</div><div class="status-row"><div><b>Bot de Production</b><p>Présence et autorisations côté VPS</p></div>${tag('Connecté · exemple','ok')}</div><div class="status-row"><div><b>OBS local</b><p>Connexion WebSocket, scènes et sources</p></div>${tag('Déconnecté · exemple','warn')}</div><div class="status-row"><div><b>Lecteurs</b><p>Alertes, effets, TTS, Soundboard, Bonk</p></div><button class="small" data-action="readers-info">Détails</button></div></div>`)}${panel('Profil & maintenance',`<div class="panel-body"><dl class="summary-list"><div><dt>Profil affiché</dt><dd>Production · scénario de maquette</dd></div><div><dt>Économie</dt><dd>La portée est annoncée au niveau de chaque action.</dd></div><div><dt>Comptes Twitch de ce PC</dt><dd>Différents des comptes et jetons du bot VPS.</dd></div><div><dt>Version de référence</dt><dd>Studio 0.1.25 · 8a897a5</dd></div></dl><p class="notice spaced">Les URL de sources et clés doivent être masquées par défaut, révélées ou copiées volontairement.</p><button class="spaced" data-action="lab">Ouvrir le laboratoire…</button></div>`)}</div>`;}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closeNav(){document.querySelector('#sidebar').classList.remove('is-open');document.querySelector('#nav-overlay').classList.remove('is-open');}
function toast(msg){clearTimeout(toastTimer);const t=document.querySelector('#toast');t.textContent=msg;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,6500);}
function modal(title,body,buttons=''){returnFocus=document.activeElement;document.querySelector('#dialog').innerHTML=`<h2 id="dialog-title">${title}</h2>${body}<div class="actions">${buttons}<button data-action="close-dialog">Fermer</button></div>`;document.querySelector('#modal').hidden=false;document.querySelector('#dialog input, #dialog button')?.focus();}
function closeDialog(){document.querySelector('#modal').hidden=true;if(returnFocus?.isConnected)returnFocus.focus();}
function showSearch(){modal('Rechercher ou agir',`<label class="visually-hidden" for="global-search">Rechercher une destination ou une action</label><input id="global-search" placeholder="Essayez « alerte », « défi », « TTS »…"><div class="search-results" id="search-results"></div>`);const input=document.querySelector('#global-search');input.addEventListener('input',()=>searchResults(input.value));searchResults('');input.focus();}
function searchResults(q){const targets=[['Centre de contrôle','home','Ouvrir la page'],['Régie live','live','Ouvrir les accès rapides'],['Catalogue des modules','modules','Parcourir toutes les fonctions'],['Alertes · atelier','module','Modules / Alertes & points de chaîne'],['Créer un défi','challenges','Communauté / Défis'],['Atelier Boutique','shop','Communauté / Boutique'],['Connexions','system','Système'],['TTS · pause de la file','tts-pause','Action sensible · aperçu du contrat']];const needle=q.toLocaleLowerCase('fr');const found=targets.filter(t=>t.join(' ').toLocaleLowerCase('fr').includes(needle));document.querySelector('#search-results').innerHTML=found.length?found.map(([title,id,path])=>`<button ${id==='tts-pause'?'data-action="tts-pause"':`data-search-screen="${id}"`}><span>${title}</span><small>${path}</small></button>`).join(''):'<p class="muted">Aucun résultat dans les écrans de référence.</p>';}
function sensitive(title,scope,copy){modal(title,`<span class="tag warn">Action réelle dans le futur Studio · représentation uniquement</span><p><b>Portée :</b> ${scope}</p><p>${copy}</p><p>Cette maquette n’exécute rien. Aucun service, réglage, objet ou solde n’est modifié.</p>`);}
function verifyChallenge(){const errors=[];if(!state.title.trim())errors.push('Renseignez un titre.');if(!Number.isInteger(Number(state.target))||Number(state.target)<=0)errors.push('L’objectif doit être un entier strictement positif.');if(state.reward==='jetons'&&(!Number.isInteger(Number(document.querySelector('#reward-amount')?.value))||Number(document.querySelector('#reward-amount')?.value)<=0))errors.push('Définissez un montant positif en Jetons.');if(state.reward==='reward')errors.push('Aucun catalogue réel connecté : sélection d’objet non vérifiable.');document.querySelector('#challenge-errors').textContent=errors.join(' ');state.verified=errors.length===0;if(state.verified)toast('Définition cohérente dans la maquette. La vérification et le recomptage réels restent à effectuer par le Core.');return state.verified;}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b)return;if(b.dataset.searchScreen){closeDialog();render(b.dataset.searchScreen,true);return;}if(b.dataset.screen){render(b.dataset.screen,true);return;}if(b.dataset.module){if(b.dataset.module==='Alertes')render('module',true);else modal(b.dataset.module,`<p>Destination canonique proposée : <b>Modules / ${escapeHtml(moduleGroups.find(g=>g.items.includes(b.dataset.module))?.name||'Catalogue')}</b>.</p><p>La maquette détaille six écrans de référence. Le dossier décrit les fonctions, les états et le déplacement de ce module.</p>${b.dataset.module==='Storyboard'?'<p>Storyboard n’a pas été retrouvé dans la base auditée : son organisation doit être confirmée avant toute refonte.</p>':''}`);return;}if(b.dataset.type){selectedType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.type===selectedType)));const label={title:'Titre',badge:'Badge',frame:'Cadre',banner:'Bannière'}[selectedType];document.querySelector('#appearance-type').textContent='· '+label;document.querySelector('#upload-label').textContent=selectedType==='title'?'Couleurs et effet du titre':'Importer le visuel : '+label.toLocaleLowerCase('fr');document.querySelector('#upload-spec').textContent=selectedType==='title'?'Sélection guidée de couleur, dégradé et effet existant.':'Les contraintes de format et de transparence viennent du validateur existant.';return;}if(b.dataset.filter){selectedGroup=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.filter===selectedGroup)));document.querySelector('#module-grid').innerHTML=moduleCards(document.querySelector('#module-search').value,selectedGroup==='favorites');return;}if(b.dataset.moduleTab){document.querySelectorAll('[data-module-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));const t=b.dataset.moduleTab;document.querySelector('#module-tab-content').innerHTML=t==='atelier'?alertWorkshop():t==='triggers'?panel('Déclencheurs liés',`<div class="row-list"><div><span>Événements Twitch</span>${tag('Paramètres uniques du module')}</div><div><span>Dons StreamElements</span>${tag('Connexion spécifique')}</div><div><span>Récompenses de points de chaîne</span><button class="small" data-action="trigger-link">Ouvrir le lien…</button></div></div><div class="panel-body"><p class="footnote">Une action peut avoir plusieurs entrées. Son composant de configuration et son exécution restent uniques.</p></div>`):panel('Historique des alertes',`<div class="empty">${icon('clock')}<b>Aucune alerte dans ce scénario</b><p>La trace finale indique l’origine, la variante, la date et le résultat de diffusion.</p></div>`);return;}
 const a=b.dataset.action;if(a==='close-dialog'){closeDialog();return;}if(a==='open-nav'){document.querySelector('#sidebar').classList.add('is-open');document.querySelector('#nav-overlay').classList.add('is-open');document.querySelector('#sidebar button')?.focus();return;}if(a==='close-nav'){closeNav();document.querySelector('.menu')?.focus();return;}if(a==='search'){showSearch();return;}if(a==='incidents'){modal('Points à vérifier',`<p>OBS déconnecté et lecteur TTS absent : deux états illustrés. Les rétablissements passés sont rangés dans l’historique plutôt qu’empilés sur chaque écran.</p>`,`<button class="primary" data-search-screen="system">Ouvrir les connexions</button>`);return;}if(a==='verify-challenge'){verifyChallenge();return;}if(a==='save-challenge'){if(!verifyChallenge())return;state.dirty=false;document.querySelector('#draft-status').textContent='Brouillon de session de maquette · aucune persistance';document.querySelector('#save-status').textContent='Conservé dans cette session de maquette';toast('Simulation d’enregistrement. Rien n’a été écrit dans Studio ou dans le Core.');return;}if(a==='activation-info'){sensitive('Activer un défi','Core, progression et récompenses','L’activation fige la condition et peut effectuer un premier recomptage. Suspendre ensuite ne retire pas les récompenses déjà attribuées.');return;}if(a==='queue-alert'){sensitive('Envoyer un test vers OBS','File réelle du profil, puis lecteur OBS','Un événement simulé peut être diffusé. L’aperçu local et cette action doivent être visuellement séparés.');return;}if(a==='stop-effect'){sensitive('Arrêter l’effet en cours','Lecteur d’effets ou module OBS concerné','Le libellé final doit nommer l’effet. Aucun arrêt global ne doit être promis sans route backend correspondante.');return;}if(a==='tts-pause'){sensitive('Mettre la file TTS en pause','File TTS du Core de ce profil','La pause est distincte d’un arrêt, d’un rejet et d’un remboursement. Le contrôle annonce le résultat confirmé par le service.');return;}if(a==='lab'){modal('Laboratoire',`<p>Le Lab reste accessible depuis une entrée dédiée. Son ouverture ne change pas automatiquement le profil.</p><p>Un changement de profil doit expliquer les lecteurs et URL concernés. Les jetons de ce PC et certaines actions peuvent toujours toucher Twitch ou OBS.</p>`);return;}if(a==='moderation-example'){modal('Intervenir sur une interaction',`<p><b>Exemple :</b> un TTS est en attente. Le panneau doit présenter l’origine, la monnaie, le statut d’exécution et les actions autorisées.</p><p>« Rejeter », « arrêter » et « rembourser » restent des intentions distinctes. Un clic ne promet pas le remboursement d’une autre monnaie.</p>`);return;}if(a==='upload-info'){modal('Choisir un visuel',`<p>Aucun fichier n’est importé dans cette maquette.</p><p>La future interface conserve les contrôles existants : formats autorisés, dimensions, poids et, pour un cadre, transparence centrale et marges. Elle montre les erreurs avant le téléversement et confirme le résultat serveur.</p>`);return;}if(a==='offer-info'){modal('Configurer une offre',`<p>L’offre référence l’objet existant. Son prix, sa monnaie, sa période et son état sont enregistrés séparément.</p><p>Un objet publié sans offre n’est pas automatiquement achetable. Les dotations, déblocages et achats gardent leurs règles.</p>`);return;}if(a==='customize-live'){modal('Personnaliser la régie',`<p>Choisir et ordonner quelques actions du registre des modules, sans dupliquer leur code. Les arrêts disponibles restent identifiables.</p><p>La première version peut se limiter aux favoris. Un système de mise en page libre n’est pas nécessaire.</p>`);return;}if(a==='readers-info'){modal('Lecteurs & OBS',`<p>Une ligne par lecteur : service, disponibilité, dernier signal et lien vers les réglages. Les URL contenant une clé restent masquées par défaut.</p><p>Un seul consommateur est conservé lorsqu’un lecteur l’exige ; ouvrir un aperçu ne doit pas prendre la place de la source OBS.</p>`);return;}if(a==='preview-alert'){toast('Aperçu de maquette uniquement. Le vrai moteur de rendu n’est pas embarqué.');return;}if(a==='shop-check'){toast('Contrôles illustrés uniquement. Aucun fichier ni catalogue réel à vérifier.');return;}if(['save-settings','shop-save','discard'].includes(a)){toast(a==='discard'?'Intention d’annulation illustrée. Aucun réglage actif n’a été modifié.':'Simulation d’enregistrement · aucune persistance ni requête réseau.');return;}if(a==='favorite'){toast('L’accès favori représente un lien vers le même module.');return;}if(a==='trigger-link'){modal('Une récompense, une action',`<p>Le détail de la récompense Twitch montre le déclencheur et ouvre le même panneau de réglage de l’effet ou de l’alerte. Aucune copie de l’action métier.</p>`);return;}modal('Périmètre de cette référence',`<p>Le dossier de conception décrit cette destination. Ce prototype explore les six écrans prioritaires et ne remplace aucun module existant.</p>`);
});
document.addEventListener('input',e=>{if(e.target.id==='item-name')document.querySelector('#item-preview-label').textContent=e.target.value||'Nom de l’objet';});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch();return;}const open=!document.querySelector('#modal').hidden;if(e.key==='Escape'){if(open)closeDialog();else closeNav();return;}if(open&&e.key==='Tab'){const nodes=[...document.querySelector('#dialog').querySelectorAll('button:not([disabled]),input,a[href],select,textarea')].filter(x=>x.offsetParent!==null);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDialog();});
render('home');
</script>
</body></html>
