<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Raptoru — Dock</title>
    <link rel="stylesheet" href="/dock.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="name">Activité</h1>
      <span
        id="dot"
        class="dot t-wait"
        title="Connexion…"
        role="img"
        aria-label="Connexion…"
      ></span>
      <span class="spacer"></span>
      <button
        type="button"
        id="pick"
        class="tool"
        title="Sélectionner des lignes (ou Ctrl + clic, Maj + clic)"
        aria-label="Sélectionner des lignes"
        aria-pressed="false"
      ></button>
      <button
        type="button"
        id="bin"
        class="tool"
        title="Corbeille d’affichage"
        aria-label="Corbeille d’affichage"
        aria-expanded="false"
        aria-controls="trash"
      >
        <span id="bincount" class="count" hidden>0</span>
      </button>
      <button
        type="button"
        id="gear"
        class="tool"
        title="Préférences"
        aria-label="Préférences"
        aria-expanded="false"
        aria-controls="prefs"
      ></button>
    </header>
    <div id="selbar" class="selbar" hidden>
      <span id="selcount"></span>
      <button type="button" id="hide" class="btn danger" disabled>
        Masquer
      </button>
      <button
        type="button"
        id="selclear"
        class="link"
        title="Annuler la sélection (Échap)"
      >
        Annuler
      </button>
    </div>
    <section id="prefs" class="panel" aria-label="Préférences" hidden>
      <div class="panel-h">
        <b>Événements affichés</b>
        <button type="button" class="link" data-close>Fermer</button>
      </div>
      <div id="prefs-body"></div>
      <div class="panel-f">
        <button type="button" id="all" class="link">Tout afficher</button>
        <button type="button" id="none" class="link">Tout masquer</button>
        <button type="button" id="reset" class="link">Réinitialiser</button>
      </div>
      <p class="hint">
        L’affichage seulement : les événements masqués restent reçus, traités et
        gardés dans l’historique.
      </p>
    </section>
    <section id="trash" class="panel" aria-label="Corbeille d’affichage" hidden>
      <div class="panel-h">
        <b>Corbeille d’affichage</b>
        <button type="button" class="link" data-close>Fermer</button>
      </div>
      <p class="hint">
        Masquées de ce dock uniquement : aucun événement, achat ou jeton n’est
        touché.
      </p>
      <ol id="trash-list" class="t-list"></ol>
      <p id="trash-empty" class="hint center">La corbeille est vide.</p>
      <p id="trash-note" class="hint" hidden></p>
      <div class="panel-f">
        <button type="button" id="t-restore" class="btn" disabled>
          Restaurer
        </button>
        <button type="button" id="t-all" class="link">Tout restaurer</button>
        <button type="button" id="t-empty" class="link danger">
          Vider la corbeille
        </button>
      </div>
    </section>
    <p id="banner" class="banner" role="status" hidden></p>
    <main class="scroll">
      <button type="button" id="pill" class="pill" hidden></button>
      <ol
        id="list"
        class="list"
        aria-live="polite"
        aria-label="Événements récents"
      ></ol>
      <p id="empty" class="empty"></p>
      <button type="button" id="older" class="older" hidden>
        Charger les plus anciens
      </button>
    </main>
    <p id="toast" class="toast" role="status" hidden></p>
    <script type="module" src="/dock.js"></script>
  </body>
</html>
