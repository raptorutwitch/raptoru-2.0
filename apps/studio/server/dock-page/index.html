<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Raptoru — Dock</title>
    <link rel="stylesheet" href="/dock.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="name">Activité</h1>
      <span
        id="dot"
        class="dot t-wait"
        title="Connexion…"
        role="img"
        aria-label="Connexion…"
      ></span>
      <button
        type="button"
        id="gear"
        class="gear"
        title="Préférences"
        aria-label="Préférences"
        aria-expanded="false"
        aria-controls="prefs"
      ></button>
    </header>
    <section id="prefs" class="prefs" aria-label="Préférences" hidden>
      <p class="prefs-h">Catégories affichées</p>
      <div id="cats" class="cats"></div>
      <button type="button" id="all" class="link">Tout afficher</button>
      <label class="opt">
        <input type="checkbox" id="costs" />
        <span>Afficher les coûts des récompenses</span>
      </label>
      <p class="hint">
        Les catégories masquées restent reçues et gardées dans l’historique.
      </p>
      <button type="button" id="reset" class="link">Réinitialiser</button>
    </section>
    <p id="banner" class="banner" role="status" hidden></p>
    <main class="scroll">
      <button type="button" id="pill" class="pill" hidden></button>
      <ol
        id="list"
        class="list"
        aria-live="polite"
        aria-label="Événements récents"
      ></ol>
      <p id="empty" class="empty">Aucun événement pour l’instant.</p>
      <button type="button" id="older" class="older" hidden>
        Charger les plus anciens
      </button>
    </main>
    <p id="toast" class="toast" role="status" hidden></p>
    <script type="module" src="/dock.js"></script>
  </body>
</html>
