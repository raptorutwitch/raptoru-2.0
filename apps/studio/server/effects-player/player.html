<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Raptoru — lecteur d'effets</title>
    <style>
      /* OBS browser source: transparent, nothing visible unless the sound needs a click (outside OBS). */
      html,
      body {
        margin: 0;
        background: transparent;
        color: #efeff1;
        font:
          13px system-ui,
          sans-serif;
      }
      /* The OBS canvas (1920×1080): effect videos fill it like the legacy overlay (Alerte_system.html). */
      #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        pointer-events: none;
      }
      #stage video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
        opacity: 0;
        --rise: 550px;
        --mirror: 1;
        transform: translateY(var(--rise)) scaleX(var(--mirror));
        transition:
          opacity 220ms linear,
          transform 2200ms linear;
      }
      #stage video.mirror {
        --mirror: -1;
      }
      #stage video.in {
        opacity: 1;
        --rise: 0px;
      }
      #stage video.still {
        opacity: 1;
        --rise: 0px;
        transition: opacity 500ms ease;
      }
      #stage video.out {
        opacity: 0;
        transition:
          opacity 500ms ease,
          transform 500ms ease;
      }
      #panel {
        position: relative;
        z-index: 1;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin: 10px 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #14111ccc;
      }
      #panel[hidden],
      button[hidden] {
        display: none;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #a970ff;
        border-radius: 8px;
        background: #2a1f3d;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel" hidden>
      <button id="enable" type="button">Activer le son</button>
      <span id="status"></span>
    </div>
    <script type="module" src="player.js"></script>
  </body>
</html>
