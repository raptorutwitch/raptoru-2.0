<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="effects-player-version" content="%PLAYER_VERSION%" />
    <title>Raptoru — lecteur d'effets</title>
    <style>
      /* OBS browser source: transparent, nothing visible unless the sound needs a click (outside OBS). */
      html,
      body {
        margin: 0;
        background: transparent;
        color: #efeff1;
        font:
          13px system-ui,
          sans-serif;
      }
      /* The OBS canvas (1920×1080): effect videos fill it like the legacy overlay (Alerte_system.html). */
      #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        pointer-events: none;
      }
      #stage video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
        opacity: 0;
        --rise: 550px;
        --mirror: 1;
        transform: translateY(var(--rise)) scaleX(var(--mirror));
        transition:
          opacity 220ms linear,
          transform 2200ms linear;
      }
      #stage video.mirror {
        --mirror: -1;
      }
      #stage video.in {
        opacity: 1;
        --rise: 0px;
      }
      #stage video.still {
        opacity: 1;
        --rise: 0px;
        transition: opacity 500ms ease;
      }
      #stage video.out {
        opacity: 0;
        transition:
          opacity 500ms ease,
          transform 500ms ease;
      }
      /* BRB (P0.2): the legacy « We'll be right back » layer of Alerte_system.html, values copied as they are. */
      #stage .wbrb {
        position: absolute;
        inset: 0;
        z-index: 8000;
        overflow: hidden;
        background: #000;
        pointer-events: none;
      }
      #stage .wbrb-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.8) contrast(1.04) brightness(0.78);
      }
      #stage .wbrb-bg-shade {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: rgba(63, 48, 11, 0.48);
      }
      #stage .wbrb-cam {
        position: absolute;
        z-index: 2;
        left: 506px;
        top: -141px;
        width: 1766px;
        height: 1436px;
        object-fit: contain;
        object-position: center center;
        transform: translateY(-1060px);
        animation: wbrbCamCurtain 1000ms cubic-bezier(0.16, 1, 0.3, 1) 1000ms
          forwards;
      }
      #stage .wbrb video {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transform: none;
        /* Legacy: the page's generic video rule (all 0.3 s ease) also applied to this video. */
        transition: all 0.3s ease;
      }
      #stage .wbrb.video-ready video {
        opacity: 1;
      }
      #stage .wbrb.fade-out {
        opacity: 0;
        transition: opacity 200ms ease;
      }
      @keyframes wbrbCamCurtain {
        0% {
          transform: translateY(-1060px);
        }
        100% {
          transform: translateY(0);
        }
      }
      /* Random Ban V2: the legacy ban layer of Alerte_system.html (video « default » / « mirror-h », « pseudo-ban »
         text), values copied as they are. */
      #stage .rb {
        position: absolute;
        inset: 0;
        z-index: 7000;
        pointer-events: none;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      #stage .rb video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 1;
        transform: none;
        transition: all 0.3s ease;
      }
      #stage .rb video.mirror {
        transform: scaleX(-1);
      }
      #stage .pseudo-ban {
        position: absolute;
        top: calc(8% + 8px);
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 42px;
        font-weight: 700;
        text-shadow:
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          2px 2px 0 #000,
          0 0 15px rgba(255, 0, 0, 0.4);
        opacity: 0;
        white-space: nowrap;
        pointer-events: none;
        z-index: 10;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        letter-spacing: 2px;
      }
      #stage .pseudo-ban .trigger {
        color: #4da6ff;
        font-weight: 900;
      }
      #stage .pseudo-ban .banned {
        color: #ff4d4d;
        font-weight: 900;
      }
      #stage .pseudo-ban.show {
        animation: banSlideUp 0.3s ease-out forwards;
      }
      #stage .pseudo-ban.hide {
        animation: banSlideDown 0.3s ease-in forwards;
      }
      @keyframes banSlideUp {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      @keyframes banSlideDown {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
      }
      /* Random Ban V2 flop: the legacy OBS text source « randomban » (GDI+ text, OBS defaults: Arial 256 px, white,
         scaled), its opacity faded by a colour correction filter. */
      #stage .rb-flop {
        position: absolute;
        z-index: 7000;
        transform-origin: 0 0;
        font-family: Arial, sans-serif;
        font-size: 256px;
        line-height: 1.15;
        color: #fff;
        white-space: nowrap;
        opacity: 0;
        transition-property: opacity;
        transition-timing-function: linear;
      }
      #stage .rb-flop.on {
        opacity: 1;
      }
      #panel {
        position: relative;
        z-index: 1;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin: 10px 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: #14111ccc;
      }
      #panel[hidden],
      button[hidden] {
        display: none;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #a970ff;
        border-radius: 8px;
        background: #2a1f3d;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel" hidden>
      <button id="enable" type="button">Activer le son</button>
      <span id="status"></span>
    </div>
    <script type="module" src="player.js"></script>
  </body>
</html>
