<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Raptoru Soundboard Lab</title>
    <style>
      body {
        margin: 0;
        padding: 10px 12px;
        background: #162130;
        color: #e9f0f4;
        font:
          13px system-ui,
          sans-serif;
      }
      button {
        padding: 6px 12px;
        border: 0;
        border-radius: 8px;
        background: #2fd8c4;
        color: #04201d;
        font: inherit;
        cursor: pointer;
      }
      button[hidden] {
        display: none;
      }
      #status {
        margin-left: 8px;
        color: #a3b5c2;
      }
    </style>
  </head>
  <body>
    <button id="enable" type="button">Activer le son</button>
    <button id="disable" type="button" hidden>Couper le son</button>
    <span id="status">Son désactivé : clique pour autoriser la lecture.</span>
    <script type="module" src="player.js"></script>
  </body>
</html>
