<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casino — banc de test</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0b16;
        --panel: #17121f;
        --line: #2c2438;
        --text: #ece6f5;
        --muted: #a497b8;
        --accent: #b98aff;
        --demo: #ff9900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 10px 16px;
      }
      h1 {
        margin: 0 8px 2px 0;
        font-size: 16px;
      }
      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      select,
      button,
      input {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #221a2e;
        color: var(--text);
        font: inherit;
      }
      input[type='number'] {
        width: 76px;
      }
      button {
        cursor: pointer;
      }
      button:hover,
      select:hover {
        border-color: var(--accent);
      }
      .modes {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .modes button {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
      }
      .modes button[aria-pressed='true'] {
        background: #3a2a55;
        color: #fff;
        font-weight: 700;
      }
      .demo {
        padding: 8px 10px;
        border: 1px dashed var(--demo);
        border-radius: 10px;
      }
      .demo > b {
        color: var(--demo);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        align-self: center;
      }
      .note {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .note b {
        color: var(--demo);
      }
      main {
        padding: 16px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
      }
      figcaption strong {
        font-size: 14px;
      }
      figcaption span {
        color: var(--muted);
        font-size: 12px;
      }
      figcaption a {
        margin-left: auto;
        color: var(--accent);
        font-size: 12px;
      }
      .frame-wrap {
        position: relative;
        display: inline-block;
        border: 1px solid var(--line);
        background: #000;
      }
      .frame-wrap[data-mode='isolated'] {
        outline: 2px dashed #6c5a86;
        outline-offset: 3px;
      }
      .frame-wrap::after {
        content: attr(data-size);
        position: absolute;
        left: 4px;
        bottom: -22px;
        color: var(--muted);
        font: 700 11px/1.4 system-ui;
        pointer-events: none;
      }
      iframe {
        display: block;
        border: 0;
      }
      /* Twitch app frame (surface Mobile): status bar, 16:9 video, channel bar, tabs, the extension below. */
      .phone {
        display: grid;
        overflow: hidden;
        border: 10px solid #000;
        border-radius: 26px;
        background: #18181b;
        box-shadow: 0 0 0 2px #333;
        color: #efeff1;
        font:
          12px/1.3 system-ui,
          sans-serif;
      }
      .phone[data-kind='p'] {
        grid-template-rows: 24px var(--video-h) 52px 44px minmax(0, 1fr) 48px;
      }
      .phone[data-kind='l'] {
        grid-template-columns: var(--video-w) minmax(0, 1fr);
        grid-template-rows: 44px minmax(0, 1fr);
      }
      .phone[data-kind='f'] {
        grid-template-rows: minmax(0, 1fr);
      }
      .ph-status {
        display: flex;
        justify-content: space-between;
        padding: 4px 14px;
        background: #000;
        color: #ccc;
        font-size: 11px;
      }
      .ph-video {
        display: grid;
        place-content: center;
        background:
          radial-gradient(60% 80% at 30% 40%, #5b3a8a, #14101c 70%), #0e0e10;
        color: #fff9;
        font-weight: 700;
        text-align: center;
      }
      .ph-video small {
        font-weight: 400;
      }
      .phone[data-kind='l'] .ph-video {
        grid-row: 1 / -1;
      }
      .phone:not([data-kind='p']) :is(.ph-status, .ph-channel, .ph-nav),
      .phone[data-kind='f'] :is(.ph-tabs, #phone-slot) {
        display: none;
      }
      .ph-channel {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid #2f2f35;
      }
      .ph-channel i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a970ff, #6441a5);
      }
      .ph-tabs {
        display: flex;
        align-items: end;
        gap: 18px;
        padding: 0 14px;
        border-bottom: 1px solid #2f2f35;
      }
      .ph-tabs span {
        padding-bottom: 10px;
        color: #adadb8;
        font-weight: 600;
      }
      .ph-tabs span.on {
        color: #fff;
        box-shadow: inset 0 -2px 0 #a970ff;
      }
      .ph-nav {
        display: grid;
        place-items: center;
        background: #000;
      }
      .ph-nav::before {
        content: '';
        width: 110px;
        height: 4px;
        border-radius: 2px;
        background: #666;
      }
      #phone-slot {
        min-height: 0;
        overflow: hidden;
      }
      .frame-wrap.in-phone {
        border: 0;
      }
      .frame-wrap.in-phone::after {
        display: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script type="module" src="casino-bench.js"></script>
  </head>
  <body>
    <header>
      <div class="row">
        <h1>Casino · banc de test</h1>
        <div class="modes" role="group" aria-label="Mode">
          <button type="button" id="mode-full" aria-pressed="true">
            Extension complète
          </button>
          <button type="button" id="mode-isolated" aria-pressed="false">
            Jeu isolé
          </button>
        </div>
        <label
          >Jeu
          <select id="game"></select
        ></label>
        <label id="surface-wrap"
          >Surface
          <select id="surface"></select
        ></label>
        <label id="state-wrap" hidden
          >État figé
          <select id="state"></select
        ></label>
        <label
          >Format
          <select id="size"></select
        ></label>
        <label
          >Largeur <input type="number" id="w" min="200" max="2000"
        /></label>
        <label
          >Hauteur <input type="number" id="h" min="150" max="1400"
        /></label>
        <button type="button" id="reload">Recharger</button>
      </div>
      <div class="row demo" id="demo">
        <b>Démo locale</b>
        <label id="d-slot"
          >Prochain tirage
          <select id="next-slot"></select
        ></label>
        <label id="d-roulette"
          >Prochain numéro
          <select id="next-roulette"></select
        ></label>
        <label id="d-bj"
          >Prochaine donne (ta main)
          <select id="next-bj"></select
        ></label>
        <label id="d-bots"
          >Joueurs fictifs
          <select id="bots"></select
        ></label>
        <label id="d-sub"
          >Abonnement (réactions subs)
          <select id="sub">
            <option value="yes">Abonné</option>
            <option value="no">Non abonné</option>
            <option value="unknown">Inconnu (Twitch pas vérifié)</option>
          </select></label
        >
        <label id="d-multi"
          >Tables et réactions
          <span
            ><button type="button" id="bj-table">+ Table fictive</button
            ><button type="button" id="bj-react">
              Réaction d’un joueur fictif</button
            ><button type="button" id="bj-sweep">
              Fermer les tables vides
            </button></span
          ></label
        >
        <label
          >Solde fictif
          <span
            ><button type="button" id="refill">Remettre 50 000</button></span
          ></label
        >
      </div>
      <p class="note" id="note"></p>
    </header>
    <main>
      <figure>
        <figcaption>
          <strong id="cap-game"></strong><span id="cap-size"></span
          ><a id="open" target="_blank" rel="noopener">ouvrir seul ↗</a>
        </figcaption>
        <div id="main-slot">
          <div class="frame-wrap" id="wrap">
            <iframe id="frame" title="Casino — banc"></iframe>
          </div>
        </div>
        <div class="phone" id="phone" hidden>
          <div class="ph-status"><span>20:41</span><span>5G · 78 %</span></div>
          <div class="ph-video">
            Stream 16:9<small>vidéo de la chaîne</small>
          </div>
          <div class="ph-channel">
            <i></i>
            <div>
              <b>Raptoru_</b><br /><small
                >Just Chatting · 1 234 spectateurs</small
              >
            </div>
          </div>
          <div class="ph-tabs">
            <span>Chat</span><span class="on">Raptoru Live</span>
          </div>
          <div id="phone-slot"></div>
          <div class="ph-nav"></div>
        </div>
        <p class="note" id="phone-note"></p>
      </figure>
    </main>
  </body>
</html>
